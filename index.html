html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.top h1{margin:0;font:600 28px/1.1 var(--display);letter-spacing:-.3px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.brand svg{width:24px;height:24px;flex:none}
@media (max-width:560px){.brand span{display:none}.top h1{font-size:26px}}
.banner{background:var(--brand-tint);color:var(--brand-deep);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px}
h2{font:600 22px/1.2 var(--display);margin:24px 0 10px;letter-spacing:-.2px}
h3{font:600 15px/1.3 var(--body);margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.neg{color:var(--bad)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums lining-nums}
.card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.screen.enter{animation:enter .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Home: where each euro of the year goes */
.hero{background:linear-gradient(155deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero .lab{display:flex;align-items:center;gap:8px;font-size:14px;opacity:.9}
.yr{background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:3px 11px;color:inherit;font-size:14px;font-weight:600}
.hero .big{font:600 52px/1.05 var(--display);letter-spacing:-1.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums lining-nums}
.hero .vs{font-size:14px;opacity:.85;margin:0 0 16px}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.12);gap:2px}
.split i{display:block;height:100%;transform-origin:0 50%}
.split .sf{background:#E9B49A}.split .sc{background:#A9C7BB}.split .sx{background:#8C9691}.split .sk{background:#F6F3EC}
.anim .split i{animation:grow 1s cubic-bezier(.2,.7,.2,1) both}.anim .split .sc{animation-delay:.12s}.anim .split .sx{animation-delay:.24s}.anim .split .sk{animation-delay:.36s}
.parts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 8px;margin-top:12px}
@media (min-width:560px){.parts{grid-template-columns:repeat(4,1fr)}}
.parts div{font-size:13px;opacity:.92}
.parts b{display:block;font:600 20px/1.2 var(--display);font-variant-numeric:tabular-nums lining-nums}
.parts i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
@media (min-width:720px){.hero{padding:24px 26px 20px}.hero .big{font-size:72px}}
/* line chart */
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.months{position:relative;height:18px;font-size:12px;color:var(--muted);margin-top:2px}
.months span{position:absolute;top:0;transform:translateX(-50%)}
.months span:first-child{transform:none}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.anim .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.3,.6,.2,1) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.anim .area{transform-origin:50% 100%;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .15s both}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.rank{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.rank:last-child{border-bottom:0}
.rank b{font:600 17px var(--display);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--brand);transform-origin:0 50%}
.bar i.c{background:var(--accent)}
.anim .bar i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.donut{display:flex;gap:16px;align-items:center}
.donut svg{width:120px;height:120px;flex:none;transform:rotate(-90deg)}
.donut ul{list-style:none;margin:0;padding:0;font-size:13px;flex:1;min-width:0}
.donut li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.donut li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut li i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.anim .donut circle.s{animation:fade .8s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* tax pot */
.pot{display:flex;gap:16px;align-items:center}
.jar{width:76px;height:96px;flex:none}
.jar .fill{transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);gap:10px;font-size:14px}
.stat:last-child{border-bottom:0}
.stat b{font:600 18px var(--display);font-variant-numeric:tabular-nums}
.stat b.c{color:var(--accent-deep)}
.taxhero{background:var(--accent-tint);border-radius:18px;padding:18px;display:flex;gap:18px;align-items:center}
.taxhero .big{font:600 46px/1 var(--display);color:var(--accent-deep);letter-spacing:-1px;font-variant-numeric:tabular-nums lining-nums}
.period{display:grid;gap:4px}
.period .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.period .h b{font:600 18px var(--display)}

/* pills */
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.bad{background:var(--bad-tint);color:var(--bad)}
.pill.wait{background:var(--soft);color:var(--muted)}

/* invoices: tickets with a torn edge */
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row b{font:600 17px var(--display);font-variant-numeric:tabular-nums}
.row .meta{font-size:13px;color:var(--muted)}
.rowb{background:none;border:0;padding:0;text-align:left;width:100%;color:inherit;font:inherit}
.card.rowb{background:var(--card);padding:14px 16px;cursor:pointer}

/* forms and controls */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.f{display:block;margin:0 0 10px}
.f>span{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.i{width:100%;min-height:44px;border:1px solid var(--line);background:var(--input);border-radius:10px;padding:9px 11px}
textarea.i{min-height:110px}
.row2,.row3{display:grid;gap:0 10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:560px){.row3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.btn{min-height:44px;border:0;border-radius:10px;background:var(--brand);color:#fff;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
:root[data-look=dark] .btn{color:#121917}
@media (prefers-color-scheme:dark){:root:not([data-look=light]) .btn{color:#121917}}
.btn.sec{background:var(--soft);color:var(--ink)}
:root[data-look=dark] .btn.sec{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-look=light]) .btn.sec{color:var(--ink)}}
.btn.bad{background:var(--bad-tint);color:var(--bad)}
:root[data-look=dark] .btn.bad{color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-look=light]) .btn.bad{color:var(--bad)}}

.btn.sm{min-height:34px;padding:4px 12px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.linkb{background:none;border:0;color:var(--brand-deep);font-weight:600;padding:0;text-decoration:underline}
.kind{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:14px}
.kind button{border:0;background:none;border-radius:9px;min-height:42px;font-weight:600;color:var(--muted)}
.kind button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toggle label{position:relative}
.toggle input{position:absolute;opacity:0}
.toggle span{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--input);font-weight:600}
.toggle input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toggle input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border:0;border-radius:14px;box-shadow:var(--shadow);padding:14px;text-align:left;display:grid;gap:4px}
.tile svg{width:26px;height:26px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile span{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
.chips button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.chips button.on{background:var(--ink);color:var(--paper)}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini th,table.mini td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini th{font-weight:600;color:var(--muted);font-size:13px}
.imp td{text-align:left !important}
.inote{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin:0 0 12px}
.inote div{flex:1;min-width:0}
.inote b{display:block}
.inote span{font-size:13px;color:var(--muted)}
.ix{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);padding:4px 6px}
.empty{text-align:center;padding:30px 16px}
.welcome{text-align:center;padding:24px 8px}
.welcome h2{font-size:30px;margin:12px 0 8px}
.welcome svg.w{width:180px;height:120px}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:4px 0;position:relative}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current]{color:var(--brand-deep);font-weight:600}
nav .plus span.p{width:46px;height:46px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:var(--shadow)}
nav .plus span.p svg{stroke:#fff;width:26px;height:26px}
:root[data-look=dark] nav .plus span.p svg{stroke:#111916}
@media (prefers-color-scheme:dark){:root:not([data-look=light]) nav .plus span.p svg{stroke:#111916}}
nav .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}
@media (min-width:1000px){nav{top:0;bottom:0;right:auto;width:96px;border-top:0;border-right:1px solid var(--line);padding-top:80px}
  nav .in{grid-template-columns:1fr;gap:18px}.app{padding-left:112px;padding-bottom:40px;max-width:1152px}}

/* sheet and toast */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));position:relative;animation:up .28s cubic-bezier(.2,.7,.2,1) both}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin-top:0}
.x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:28px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:20;font-size:15px;max-width:90vw;animation:fade .2s both}
.coin{position:fixed;width:16px;height:16px;border-radius:50%;background:var(--accent);z-index:15;pointer-events:none;animation:coin .9s cubic-bezier(.4,0,.2,1) forwards}
@keyframes coin{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:.2}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
@media (max-width:600px){
  .imp,.imp tbody{display:block}
  .imp tr:first-child{display:none}
  .imp tr{display:grid;grid-template-columns:30px auto minmax(0,1fr) auto;grid-template-areas:"c d d a" "c t s s";gap:4px 8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
  table.mini.imp td{padding:0;border:0}
  .imp td:nth-child(1){grid-area:c;align-self:start}
  .imp td:nth-child(2){grid-area:t;font-size:12px;color:var(--muted)}
  .imp td:nth-child(3){grid-area:d}
  .imp td:nth-child(4){grid-area:s}
  .imp td:nth-child(4) select{width:100%}
  .imp td:nth-child(5){grid-area:a;white-space:nowrap}
}

.pick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.pick select{min-height:36px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.hero .sub{font-size:14px;opacity:.85;margin:0 0 14px}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 10px}
.key i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.health{background:var(--accent-tint);color:var(--accent-deep);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.addrow{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.addrow h3{display:flex;justify-content:space-between;align-items:center}


/* Reseller: swing tags, tally counter, stock age */
.hero .own{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.hero .own span{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-size:13px}
.split .sx{background:#8C9691}.split .sk{background:#F7F4EF}.split .sf{background:#D9B3CB}.split .sc{background:#A9C7BB}.split .ss{background:#E9DCC6}
.anim .split .sc{animation-delay:.1s}.anim .split .ss{animation-delay:.2s}.anim .split .sx{animation-delay:.3s}.anim .split .sk{animation-delay:.4s}
.parts.five{grid-template-columns:repeat(2,1fr)}
@media (min-width:560px){.parts.five{grid-template-columns:repeat(5,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font:600 24px/1.15 var(--display);font-variant-numeric:tabular-nums lining-nums;margin-top:2px}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kpi.alert b{color:var(--accent-deep)}
/* item cards are price tags: a kraft head with a punched hole and a string */
.tag{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:start;background:var(--card);border:0;border-radius:8px 14px 14px 8px;
  box-shadow:var(--shadow);padding:12px 14px 12px 40px;text-align:left;width:100%;color:inherit;font:inherit;cursor:pointer}
.tag::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;background:var(--kraft);border-radius:8px 0 0 8px;
  clip-path:polygon(100% 0,100% 100%,40% 100%,0 calc(100% - 14px),0 14px,40% 0)}
.tag::after{content:"";position:absolute;left:8px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--string)}
.tag.sold::before{background:var(--mint)}
.tag.slow::before{background:var(--sand)}
.tag.off::before{background:var(--soft)}
.tag .t{font-weight:600}
.tag .meta{font-size:13px;color:var(--muted)}
.tag .amt{font:600 18px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.tag .sub{font-size:13px;text-align:right;color:var(--muted)}
.tag .sub.pos{color:var(--brand-deep);font-weight:600}
.tag .sub.neg{color:var(--bad);font-weight:600}
.tag .pill{margin-top:4px;justify-self:start}
.tlist{display:grid;gap:10px}
@media (min-width:1000px){.tlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tag .rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tag .rt .btn{margin-top:6px}
/* the reporting-limit counter: one tick per sale up to the limit */
.lim{display:grid;gap:8px}
.lim .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lim .h b{font:600 18px var(--display)}
.tally{display:grid;gap:2px}
.tally i{height:20px;border-radius:2px;background:var(--soft);min-width:0}
.tally i.on{background:var(--brand)}
.tally.near i.on{background:var(--accent)}
.tally.hit i.on{background:var(--accent-deep)}
.anim .tally i.on{animation:tick .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes tick{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.mbar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;position:relative}
.mbar i{display:block;height:100%;background:var(--brand);border-radius:5px;transform-origin:0 50%}
.mbar.near i{background:var(--accent)}.mbar.hit i{background:var(--accent-deep)}
.anim .mbar i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.limnote{background:var(--accent-tint);color:var(--accent-deep);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.ages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end;height:130px;margin-top:6px}
.ages div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:12px;color:var(--muted);text-align:center}
.ages i{display:block;width:70%;max-width:44px;border-radius:8px 8px 3px 3px;background:var(--brand);transform-origin:50% 100%}
.ages div.old i{background:var(--accent)}
.ages b{font:600 15px var(--display);color:var(--ink)}
.anim .ages i{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:140px;position:relative}
.cols div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.cols i{display:block;width:72%;border-radius:6px 6px 2px 2px;background:var(--brand);transform-origin:50% 100%}
.cols i.neg{background:var(--bad);border-radius:2px 2px 6px 6px}
.cols div.fut i{background:var(--soft)}
.cols span{font-size:11px;color:var(--muted);margin-top:4px}
.anim .cols i{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.prev{background:var(--soft);border-radius:12px;padding:10px 12px;margin:6px 0 10px}
.prev .row{padding:5px 0}
.prev .tot b{font-size:20px}

<script>/* Reseller Profit Tracker app: the math. Same rules as the spreadsheet (plan/spec.md), checked by test.js

    "United States": ["$", "both", 201, 20000, "before fees", ["2026-01-01", "2026-04-01", "2026-06-01", "2026-09-01"], ["2026-04-15", "2026-06-15", "2026-09-15", "2027-01-15"]],
    "Other - custom": ["", "either", 30, 2000, "after fees", ["2026-01-01", "2026-04-01", "2026-07-01", "2026-10-01"], ["2026-04-15", "2026-07-15", "2026-10-15", "2027-01-15"]]

    ["Mercari (US)", .10, "Yes", 0, 0, 0, 0, 0, 0], ["Whatnot (US)", .08, "No", 0, .029, .30, 0, 0, 0], ["Vestiaire Collective", .17, "No", 0, .03, 0, 3, 12, 75],

  var ITEM_CATS = ["Women's clothing", "Men's clothing", "Kids' clothing", "Shoes", "Bags", "Accessories", "Jewellery", "Vintage", "Designer", "Sportswear", "Books",

      r.profit = r.status === "Sold" || r.status === "Refunded" ? r2(r.received - shipout - cost - extra) : r.status === "Written off" ? r2(-cost - extra) : null;
      r.resdate = r.status === "Sold" || r.status === "Refunded" ? (x.sold || null) : r.status === "Written off" ? (x.sold || r.start) : null;
      if (r.status === "Sold" || r.status === "Refunded") r.days = x.sold && r.start && x.sold >= r.start ? d2n(x.sold) - d2n(r.start) : null;
      else if (r.status === "Listed" || r.status === "Not listed") r.days = r.start ? Math.max(0, d2n(asof) - d2n(r.start)) : null;
      else r.days = null;

      r.age = r.instock && r.days != null ? (r.days <= 30 ? 1 : r.days <= 60 ? 2 : r.days <= 90 ? 3 : r.days <= 180 ? 4 : 5) : null;

      r.cost = cost; r.extra = extra; r.price = price; r.shipin = shipin; r.shipout = shipout; r.lprice = n0(x.lprice); r.sold = x.sold || null;

      r.check = !r.start ? "Check: bought or listed date" : soldref && (!x.sold || !isNum(x.price)) ? "Check: sale date or price" :

  }
  function table(rows, a, b, names, key) {
    var out = [];
    names.forEach(function (nm, k) {

    else if (a === "del-item") { if (confirm("Delete this item?")) { drop("items", id); save(); closeSheet(); view.keep = true; render(); toast("Deleted"); } }
    else if (a === "add-kind") { view.tab = "add"; view.kind = v; view.anim = true; closeSheet(); window.scrollTo(0, 0); render(); }
    else if (a === "expense") expenseSheet(id);
    else if (a === "del-exp") { if (confirm("Delete this running cost?")) { drop("expenses", id); save(); closeSheet(); view.keep = true; render(); toast("Deleted"); } }
    else if (a === "platform") platformSheet(id || null);
    else if (a === "del-platform") { var p = byId("platforms", id), n = S.items.filter(function (x) { return x.platform === p.name; }).length;
      if (confirm(n ? p.name + " is on " + n + " items. Delete it anyway? Its sales will show as to check." : "Delete " + p.name + "?")) { drop("platforms", id); save(); closeSheet(); view.keep = true; render(); } }
    else if (a === "del-pay") { if (confirm("Delete this record?")) { drop("payments", id); save(); view.keep = true; render(); } }
    else if (a === "more") { view.tab = "more"; view.more = v; view.shown = 40; view.anim = true; closeSheet(); render(); window.scrollTo(0, 0); }
    else if (a === "show-more") { view.shown += 40; view.keep = true; render(); }
    else if (a === "copy") { var txt = tsv(v); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { toast("Copied " + S[v].length + " rows"); },
      function () { download(v + ".tsv", txt, "text/tab-separated-values"); }); }
    else if (a === "csv") download("reseller-" + v + ".csv", csv(v), "text/csv");
    else if (a === "install") {
      if (window.__bip) { var bip = window.__bip; window.__bip = null; bip.prompt(); bip.userChoice.then(function (r) { if (r.outcome === "accepted") { flag("installed"); render(); } }); }
      else installHelp(); }
    else if (a === "no-install") { flag("noInstall"); view.keep = true; render(); }
    else if (a === "backup") { download("reseller-backup-" + realToday() + ".json", JSON.stringify(S), "application/json"); toast("Backup saved"); }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeSheet();
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches('div[role="button"][data-a]')) { ev.preventDefault(); ev.target.click(); } });
  var pvT = null;
  function livePreview(el) {
    clearTimeout(pvT); pvT = setTimeout(function () { var pv = document.getElementById("prev"); if (!pv || !document.body.contains(el)) return;
      var f = form(el), base = el.id === "sellf" ? clone(byId("items", el.dataset.id)) : { id: el.dataset.id };
      if (el.id === "itemf" && !el.dataset.new) base = clone(byId("items", el.dataset.id));
      if (el.dataset.new && f.already !== "Yes") ["sold", "price", "shipin", "shipout", "order", "fee", "status"].forEach(function (k) { delete f[k]; });
      pv.innerHTML = previewOf(itemFrom(f, base)); }, 120);
  }
  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.id === "iq" || t.id === "eq") { view[t.id] = t.value; var pos = t.selectionStart, idn = t.id; view.keep = true; render(); var m = document.getElementById(idn); m.focus(); m.setSelectionRange(pos, pos); }
    else if (t.closest("#itemf") || t.closest("#sellf")) livePreview(t.closest("form"));
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "pyear") { S.year = t.value ? +t.value : null; save(); view.anim = true; view.keep = true; render(); }
    else if (t.id === "pper") { S.period = t.value; save(); view.anim = true; view.keep = true; render(); }
    else if (t.id === "restore") { var file = t.files[0]; if (!file) return; var rd = new FileReader();
      rd.onload = function () { try { var x = JSON.parse(rd.result); if (!x.settings || !Array.isArray(x.items)) throw 0; S = Object.assign(blank(), x); save(); view.anim = true; render(); toast("Backup restored"); }
        catch (e) { toast("That file isn't a " + APPNAME + " backup"); } }; rd.readAsText(file); }
    else if (t.name === "already" && t.closest("#itemf")) { var box = document.getElementById("salebox"); if (box) box.hidden = t.value !== "Yes";
      if (t.value === "Yes") { var sd = box.querySelector("[name=sold]"); if (sd && !sd.value) sd.value = today(); } livePreview(t.closest("form")); }
    else if (t.closest("#itemf") || t.closest("#sellf")) livePreview(t.closest("form"));
  });
  document.addEventListener("submit", function (ev) {
    ev.preventDefault(); var el = ev.target, f = form(el);
    if (el.id === "itemf") {
      if (!(f.item || "").trim()) { toast("Type what the item is"); return; }
      var isNew = !!el.dataset.new, base = isNew ? { id: el.dataset.id } : byId("items", el.dataset.id);
      if (isNew && f.already !== "Yes") ["sold", "price", "shipin", "shipout", "order", "fee", "status"].forEach(function (k) { delete f[k]; });
      var x = itemFrom(f, base); if (x.cost == null && x.kind !== "My own item") x.cost = 0;
      upsert("items", x); save(); closeSheet();
      var r = C.itemRows(S, R.U, today()).filter(function (y) { return y.id === x.id; })[0];
      if (isNew) { view.tab = "items"; view.itf = r && r.instock ? "stock" : "sold"; view.iq = ""; view.anim = true; window.scrollTo(0, 0); } else view.keep = true;
      render(); toast(isNew ? (r && r.profit != null ? "Added: " + (r.profit < 0 ? "loss " : "profit ") + money(Math.abs(r.profit)) : "Added to stock") : "Saved"); }
    else if (el.id === "sellf") { var it = byId("items", el.dataset.id), y = itemFrom(f, it);
      if (y.price == null || !y.sold) { toast("Type the sale date and price"); return; }
      if (it.status === "Listed" || it.status === "Not listed") y.status = null;
      upsert("items", y); save(); closeSheet(); view.keep = true; render();
      var rr = rowOf(y.id); toast("Sold: " + (rr && rr.profit < 0 ? "loss " : "profit ") + money(Math.abs(rr ? rr.profit : 0))); }
    else if (el.id === "expf") { var ea = N(f.amount); if (ea == null) { toast("Type the amount"); return; }
      upsert("expenses", { id: el.dataset.id, date: f.date || today(), cat: f.cat, amount: ea, share: N(f.share), note: f.note || "" });
      sortDate("expenses"); save(); closeSheet();
      if (el.dataset.new) { view.tab = "more"; view.more = "expenses"; view.anim = true; window.scrollTo(0, 0); } else view.keep = true;
      render(); toast("Running cost added"); }
    else if (el.id === "platf") { var name = f.name.trim(), pid = el.dataset.id, old = el.dataset.old;
      if (!name) { toast("Type a name"); return; }
      if (S.platforms.some(function (p) { return p.name.toLowerCase() === name.toLowerCase() && p.id !== pid; })) { toast("You already have a platform with that name"); return; }
      var pc = function (v) { var n = N(v); return n == null ? 0 : n / 100; }, nn = function (v) { var n = N(v); return n == null ? 0 : n; };
      upsert("platforms", { id: pid, name: name, pct: pc(f.pct), onship: f.onship === "Yes" ? "Yes" : "No", fixed: nn(f.fixed), ppct: pc(f.ppct), pfix: nn(f.pfix), pmin: nn(f.pmin), sflat: nn(f.sflat), sunder: nn(f.sunder), note: f.note || "" });
      if (old && old !== name) S.items.forEach(function (x) { if (x.platform === old) x.platform = name; });
      save(); closeSheet(); view.keep = true; render(); toast("Platform saved"); }
    else if (el.id === "payf") { var pa = N(f.amount); if (pa == null) { toast("Type the amount"); return; }
      S.payments.push({ id: uid("t"), date: f.date || today(), year: N(f.year) || R.dash.taxyear, q: f.q, amount: pa, note: f.note || "" }); save(); view.keep = true; render(); toast("Recorded"); }
    else if (el.id === "setf") { var T0 = S.settings, tp = N(f.tax_pct), sd = N(f.slow_days), wp = N(f.warn_pct), ov = {};
      if ((f.ov_label || "").trim()) ov.label = f.ov_label.trim();
      if (f.ov_rule) ov.rule = f.ov_rule; if (f.ov_basis) ov.basis = f.ov_basis;
      if (N(f.ov_lim_sales) != null) ov.lim_sales = N(f.ov_lim_sales); if (N(f.ov_lim_money) != null) ov.lim_money = N(f.ov_lim_money);
      Object.assign(T0, { biz: f.biz || "", look: f.look, country: f.country, tax_base: f.tax_base, tax_pct: tp == null ? T0.tax_pct : tp / 100,
        slow_days: sd == null ? T0.slow_days : Math.round(sd), warn_pct: wp == null ? T0.warn_pct : wp / 100, ov: ov,
        qstart: [0, 1, 2, 3].map(function (i) { return f["qs" + i] || null; }), qremind: [0, 1, 2, 3].map(function (i) { return f["qr" + i] || null; }) });
      [["itemCats", f.itemCats], ["sources", f.sources], ["expCats", f.expCats]].forEach(function (p) { var l = lines(p[1]); if (l.length) S[p[0]] = l; });
      save(); view.keep = true; render(); toast("Settings saved"); }
  });

  // ---------------------------------------------------------------- start
  store.get(KEY).then(function (v) { S = v ? Object.assign(blank(), v) : blank(); render(); });
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__bip = e; });
  window.addEventListener("appinstalled", function () { window.__bip = null; flag("installed"); if (S) render(); });
  // New version: the new worker takes over, then the page reloads once so the update shows straight away.
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    var hadSW = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (r) { r.update(); }).catch(function () {});
  }
})();
